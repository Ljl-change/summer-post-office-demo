<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>夜班便利店 · 第一夜</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #070510;
      --panel: #100a20;
      --cyan: #00ffff;
      --pink: #ff006e;
      --amber: #ffb000;
      --muted: #877fa2;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: var(--ink);
      font-family: "Courier New", "Microsoft YaHei", monospace;
      color: #fff;
    }

    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 20%, #27154b 0, #0a0613 42%, #000 78%);
    }

    .shell {
      width: min(1180px, 100vw);
      padding: 18px;
    }

    .topbar {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: clamp(22px, 3vw, 42px);
      line-height: .9;
      letter-spacing: -3px;
      color: var(--cyan);
      text-shadow: 3px 0 var(--pink), 0 0 16px rgba(0,255,255,.7);
    }

    .meta {
      margin: 0;
      color: var(--amber);
      text-align: right;
      font-size: 13px;
    }

    .screen {
      position: relative;
      overflow: hidden;
      border: 2px solid var(--cyan);
      background: #000;
      box-shadow: 8px 8px 0 var(--pink), 0 0 30px rgba(0,255,255,.22);
    }

    .screen::after {
      content: "";
      pointer-events: none;
      position: absolute;
      inset: 0;
      z-index: 4;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0) 0,
        rgba(255,255,255,0) 3px,
        rgba(0,0,0,.16) 4px
      );
      mix-blend-mode: multiply;
    }

    canvas {
      width: 100%;
      display: block;
      aspect-ratio: 16 / 9;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding-top: 16px;
      font-size: 13px;
      color: var(--muted);
    }

    .keys { color: #fff; }

    kbd {
      display: inline-block;
      min-width: 26px;
      margin: 0 2px;
      padding: 4px 7px;
      border: 1px solid var(--cyan);
      color: var(--cyan);
      background: var(--panel);
      text-align: center;
      box-shadow: 2px 2px 0 var(--pink);
    }

    @media (max-width: 700px) {
      .shell { padding: 10px; }
      .topbar { align-items: start; }
      .meta { display: none; }
      .footer { flex-direction: column; gap: 8px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <h1>夜班便利店</h1>
      <p class="meta">第一夜 / 暴雨 / 00:13</p>
    </header>

    <section class="screen" aria-label="夜班便利店像素游戏原型">
      <canvas id="game" width="960" height="540" tabindex="0"></canvas>
    </section>

    <footer class="footer">
      <div class="keys"><kbd>A</kbd><kbd>D</kbd> 移动　<kbd>W</kbd>/<kbd>空格</kbd> 跳跃　<kbd>E</kbd> 互动　<kbd>R</kbd> 重来</div>
      <div>完成左上角的夜班任务</div>
    </footer>
  </main>

  <script>
    const canvas = document.querySelector('#game');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    const W = canvas.width;
    const H = canvas.height;
    const FLOOR = 438;
    const keys = new Set();
    let last = performance.now();
    let clock = 0;
    let rainOffset = 0;
    let glitch = 0;
    let started = false;

    const palette = {
      night: '#090817', wall: '#1b1730', wall2: '#29213f', trim: '#393252',
      cyan: '#00ffff', pink: '#ff006e', amber: '#ffb000', white: '#e9f7ff',
      glass: '#101b35', floor: '#171426', grout: '#28223a', black: '#05040a'
    };

    const player = {
      x: 210, y: FLOOR - 44, w: 24, h: 44,
      vx: 0, vy: 0, facing: 1, grounded: true,
      walk: 0, blink: 0
    };

    const interactables = [
      { x: 742, y: 330, w: 128, h: 108, type: 'counter', label: '查看收银台' },
      { x: 52, y: 232, w: 112, h: 206, type: 'door', label: '查看店门' },
      { x: 348, y: 258, w: 72, h: 180, type: 'freezer', label: '检查冰柜' }
    ];

    let prompt = null;
    let night = 1;
    let stage = 0;
    let dialogueQueue = [];
    let dialogue = null;
    let choice = null;
    let ending = null;
    let inventory = [];
    let firstChoice = null;
    const visitor = { visible: false, x: 104, targetX: 690, arrived: false };
    const tasks = {
      1: ['关店前检查门锁', '调查突然停转的冰柜', '查看响起的收银机', '确认门外的人是谁', '和陌生顾客交谈', '检查那张旧小票'],
      2: ['查看昨夜的监控录像', '检查冰柜里的热牛奶', '询问再次出现的顾客', '查看玻璃门上的倒影', '回到收银台查看监控']
    };
    const times = {
      1: ['00:13', '00:17', '00:24', '00:31', '00:32', '00:33'],
      2: ['00:13', '00:18', '00:26', '00:31', '00:33']
    };

    function rect(x, y, w, h, color) {
      ctx.fillStyle = color;
      ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
    }

    function line(x1, y1, x2, y2, color, width = 1) {
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    }

    function text(value, x, y, color = palette.white, size = 16, align = 'left') {
      ctx.fillStyle = color;
      ctx.font = `bold ${size}px "Courier New", "Microsoft YaHei", monospace`;
      ctx.textAlign = align;
      ctx.textBaseline = 'top';
      ctx.fillText(value, x, y);
    }

    function drawBackground() {
      rect(0, 0, W, H, palette.night);
      rect(0, 58, W, 380, palette.wall);

      for (let y = 76; y < FLOOR; y += 24) {
        line(0, y, W, y, '#211b35');
      }
      for (let x = 0; x < W; x += 48) {
        line(x, 58, x, FLOOR, '#201a33');
      }

      rect(0, 42, W, 16, palette.trim);
      rect(0, 58, W, 4, palette.pink);
      rect(0, FLOOR, W, H - FLOOR, palette.floor);
      for (let x = -50; x < W + 80; x += 96) {
        line(x, FLOOR, x + 58, H, palette.grout, 2);
      }
      for (let y = FLOOR + 34; y < H; y += 34) line(0, y, W, y, palette.grout, 2);

      drawSign();
      drawDoor();
      drawFreezer();
      drawShelves();
      drawCounter();
      drawCeilingLights();
      if (visitor.visible) drawVisitor();

      if (glitch > 0) {
        ctx.save();
        ctx.globalAlpha = Math.min(.28, glitch);
        for (let i = 0; i < 8; i++) {
          const y = (i * 79 + Math.floor(clock * 120)) % H;
          rect((i % 2 ? -18 : 14), y, W, 3 + (i % 3) * 3, i % 2 ? palette.pink : palette.cyan);
        }
        ctx.restore();
      }
    }

    function drawSign() {
      rect(345, 78, 270, 64, '#070510');
      rect(351, 84, 258, 52, '#120b21');
      text('24H', 385, 91, palette.pink, 34);
      text('夜班便利店', 472, 98, palette.cyan, 22);
      rect(350, 140, 260, 3, palette.cyan);
    }

    function drawCeilingLights() {
      [190, 480, 770].forEach((x, i) => {
        rect(x - 62, 44, 124, 7, i === 1 ? palette.cyan : '#b7f9ff');
        ctx.fillStyle = 'rgba(0,255,255,.035)';
        ctx.beginPath();
        ctx.moveTo(x - 70, 51); ctx.lineTo(x + 70, 51);
        ctx.lineTo(x + 130, FLOOR); ctx.lineTo(x - 130, FLOOR);
        ctx.fill();
      });
    }

    function drawDoor() {
      rect(48, 218, 120, 220, '#080714');
      rect(54, 226, 108, 205, palette.glass);
      rect(61, 233, 94, 192, '#0a1630');
      rect(61, 233, 94, 4, palette.cyan);
      rect(153, 226, 9, 205, palette.pink);
      rect(136, 322, 10, 5, palette.amber);
      text('营业中', 108, 255, palette.cyan, 16, 'center');
      text('OPEN', 108, 277, palette.pink, 15, 'center');

      ctx.save();
      ctx.beginPath(); ctx.rect(61, 300, 74, 118); ctx.clip();
      for (let i = 0; i < 20; i++) {
        const rx = 64 + ((i * 37) % 83);
        const ry = 290 + ((i * 43 + rainOffset) % 150);
        line(rx, ry, rx - 5, ry + 15, '#5476ab', 2);
      }
      ctx.restore();

      if (night === 1 && stage >= 3 && !visitor.visible && !ending) {
        rect(91, 351, 34, 67, '#07050d');
        rect(84, 365, 49, 45, '#07050d');
        rect(99, 338, 18, 20, '#07050d');
        rect(104, 346, 3, 3, palette.pink);
      }
    }

    function drawFreezer() {
      rect(338, 248, 92, 190, '#080714');
      rect(344, 256, 80, 170, '#152649');
      rect(350, 265, 32, 146, '#203c68');
      rect(386, 265, 32, 146, '#203c68');
      rect(380, 265, 4, 146, palette.cyan);
      rect(355, 308, 20, 4, '#9ffaff');
      rect(393, 335, 18, 5, '#f5a6cf');
      text('冰饮', 384, 223, palette.cyan, 15, 'center');
    }

    function drawShelves() {
      const sx = 470, sy = 236, sw = 210;
      rect(sx, sy, sw, 202, '#0c0915');
      rect(sx + 8, sy + 8, sw - 16, 186, '#3a2948');
      for (let row = 0; row < 3; row++) {
        const y = sy + 35 + row * 54;
        rect(sx + 12, y, sw - 24, 8, '#80634d');
        for (let col = 0; col < 8; col++) {
          const colors = [palette.pink, palette.cyan, palette.amber, '#8d62d9'];
          const h = 18 + ((col + row) % 3) * 5;
          rect(sx + 18 + col * 22, y - h, 14, h, colors[(col + row * 2) % colors.length]);
          rect(sx + 20 + col * 22, y - h + 4, 10, 3, '#f7d7ee');
        }
      }
      text('零食 / 饮料', sx + sw / 2, sy - 26, palette.amber, 14, 'center');
    }

    function drawCounter() {
      rect(730, 344, 160, 94, '#0b0914');
      rect(738, 354, 144, 84, '#3b2447');
      rect(726, 337, 170, 13, '#8a5876');
      rect(760, 299, 62, 38, '#090713');
      rect(766, 305, 50, 25, '#132d42');
      rect(773, 311, 28, 4, palette.cyan);
      rect(837, 318, 24, 19, '#181226');
      rect(844, 309, 10, 9, palette.amber);
      text('收银', 810, 382, '#f4c9e4', 18, 'center');
      if (night === 1 && (stage === 2 || stage === 5)) {
        rect(827, 332, 32, 4, palette.white);
        rect(832, 326, 22, 6, '#d8e4df');
      }
    }

    function drawVisitor() {
      const x = Math.round(visitor.x);
      const y = FLOOR - 42;
      rect(x + 4, y + 16, 17, 22, '#11101d');
      rect(x + 6, y + 2, 15, 16, '#c8b3a8');
      rect(x + 4, y, 18, 8, '#d9d6cf');
      rect(x + 2, y + 5, 5, 15, '#d9d6cf');
      rect(x + 9, y + 10, 2, 2, '#06050a');
      rect(x + 17, y + 10, 2, 2, '#06050a');
      rect(x + 6, y + 36, 6, 6, '#08070d');
      rect(x + 15, y + 36, 6, 6, '#08070d');
      if (!visitor.arrived) {
        rect(x + 1, y + 20, 3, 16, '#c8b3a8');
      }
    }

    function drawPlayer() {
      const x = Math.round(player.x);
      const y = Math.round(player.y);
      const moving = Math.abs(player.vx) > 20 && player.grounded;
      const phase = Math.floor(player.walk) % 4;
      const bob = moving && (phase === 1 || phase === 3) ? 1 : 0;
      const flip = player.facing;
      const px = (localX, width = 1) => flip === 1 ? x + localX : x + player.w - localX - width;

      ctx.save();
      ctx.globalAlpha = .3;
      rect(x - 4, FLOOR - 4, 32, 5, '#000');
      ctx.restore();

      // legs
      const legA = moving ? (phase < 2 ? -2 : 2) : 0;
      const legB = -legA;
      rect(px(5), y + 33 + bob, 6, 9 + legA, '#2c285a');
      rect(px(13), y + 33 + bob, 6, 9 + legB, '#2c285a');
      rect(px(3), y + 40 + bob + legA, 9, 4, '#10101c');
      rect(px(12), y + 40 + bob + legB, 9, 4, '#10101c');

      // body and jacket
      rect(px(4), y + 17 + bob, 16, 19, '#d64172');
      rect(px(4), y + 17 + bob, 5, 17, '#ff5f91');
      rect(px(10), y + 18 + bob, 3, 18, '#151125');
      rect(px(20), y + 20 + bob, 4, 14, '#f0b18d');
      rect(px(20), y + 29 + bob, 5, 5, '#f0b18d');

      // head, hair and face
      rect(px(5), y + 4 + bob, 15, 15, '#f0b18d');
      rect(px(4), y + 2 + bob, 17, 7, '#171125');
      rect(px(3), y + 6 + bob, 5, 10, '#171125');
      rect(px(7), y + 1 + bob, 11, 4, '#2a1b3e');
      rect(px(17), y + 10 + bob, 2, 2, '#18101e');
      rect(px(20), y + 13 + bob, 2, 2, '#ff8c9c');

      if (!player.grounded) {
        rect(px(2), y + 19, 4, 12, '#f0b18d');
        rect(px(18), y + 18, 4, 12, '#f0b18d');
      }
    }

    function drawHUD() {
      const currentTasks = tasks[night];
      const currentTimes = times[night];
      rect(18, 18, 300, 58, 'rgba(5,4,10,.82)');
      rect(18, 18, 300, 2, palette.cyan);
      text(night === 1 ? '第一夜' : '第二夜', 31, 28, palette.cyan, 16);
      text(ending ? '夜班结束' : currentTasks[Math.min(stage, currentTasks.length - 1)], 31, 50, palette.white, 13);
      text(currentTimes[Math.min(stage, currentTimes.length - 1)], 927, 20, palette.amber, 16, 'right');

      if (inventory.length) {
        rect(790, 52, 151, 30, 'rgba(5,4,10,.78)');
        text(`持有：${inventory.join('、')}`, 927, 60, palette.cyan, 12, 'right');
      }

      if (prompt && !dialogue && !choice && !ending && started) {
        const label = `E  ${prompt.label}`;
        ctx.font = 'bold 14px "Courier New", "Microsoft YaHei", monospace';
        const width = 34 + ctx.measureText(label).width;
        rect(W / 2 - width / 2, 470, width, 34, 'rgba(5,4,10,.9)');
        rect(W / 2 - width / 2, 470, 4, 34, palette.cyan);
        text(label, W / 2, 479, palette.white, 14, 'center');
      }

      if (dialogue) {
        rect(118, 444, 724, 78, 'rgba(5,4,10,.96)');
        rect(118, 444, 724, 3, palette.pink);
        text(dialogue.speaker, 140, 457, dialogue.speaker === '陌生顾客' ? palette.pink : palette.cyan, 13);
        text(dialogue.text, 140, 480, palette.white, 15);
        text('E', 818, 497, palette.amber, 13, 'right');
      }

      if (choice) {
        rect(210, 414, 540, 106, 'rgba(5,4,10,.97)');
        rect(210, 414, 540, 3, palette.cyan);
        text(choice.question, 480, 433, palette.white, 16, 'center');
        text(`1  ${choice.options[0]}      2  ${choice.options[1]}`, 480, 472, palette.amber, 15, 'center');
      }

      if (!started) {
        rect(0, 0, W, H, 'rgba(5,4,10,.82)');
        text('夜班便利店', W / 2, 178, palette.cyan, 38, 'center');
        text(night === 1 ? '第一夜：没有日期的小票' : '第二夜：录像里的人', W / 2, 231, palette.pink, 18, 'center');
        text('按任意键开始', W / 2, 316, palette.white, 16, 'center');
      }

      if (ending) {
        rect(0, 0, W, H, 'rgba(5,4,10,.9)');
        text(ending.title, W / 2, 166, ending.color, 32, 'center');
        text(ending.line1, W / 2, 230, palette.white, 16, 'center');
        text(ending.line2, W / 2, 258, palette.white, 16, 'center');
        if (ending.next) {
          text('按 N 进入第二夜', W / 2, 326, palette.cyan, 15, 'center');
          text('按 R 从第一夜重来', W / 2, 354, palette.amber, 13, 'center');
        } else {
          text('按 R 从第一夜重新开始', W / 2, 334, palette.amber, 14, 'center');
        }
      }
    }

    function update(dt) {
      clock += dt;
      rainOffset += dt * 60;
      glitch = Math.max(0, glitch - dt * .7);
      if (!started || ending || choice) return;

      if (visitor.visible && !visitor.arrived) {
        visitor.x += 62 * dt;
        if (visitor.x >= visitor.targetX) {
          visitor.x = visitor.targetX;
          visitor.arrived = true;
          if (night === 1) {
            queueDialogue([
              ['陌生顾客', '请问……这里还卖热牛奶吗？'],
              ['我', '你是怎么进来的？我没有开门。']
            ]);
          }
        }
      }
      const left = keys.has('KeyA') || keys.has('ArrowLeft');
      const right = keys.has('KeyD') || keys.has('ArrowRight');
      const target = (right ? 1 : 0) - (left ? 1 : 0);
      const accel = player.grounded ? 1150 : 650;
      const maxSpeed = 150;
      player.vx += target * accel * dt;

      if (!target) player.vx *= Math.pow(.001, dt);
      player.vx = Math.max(-maxSpeed, Math.min(maxSpeed, player.vx));
      if (target) player.facing = target;

      player.vy += 900 * dt;
      player.x += player.vx * dt;
      player.y += player.vy * dt;
      player.x = Math.max(20, Math.min(W - player.w - 20, player.x));

      if (player.y + player.h >= FLOOR) {
        player.y = FLOOR - player.h;
        player.vy = 0;
        player.grounded = true;
      }

      if (Math.abs(player.vx) > 20 && player.grounded) player.walk += dt * 10;

      prompt = null;
      let nearest = Infinity;
      const activeItems = visitor.visible && visitor.arrived
        ? [...interactables, { x: visitor.x - 18, y: FLOOR - 52, w: 64, h: 52, type: 'visitor', label: '和顾客交谈' }]
        : interactables;
      for (const item of activeItems) {
        const playerCenter = player.x + player.w / 2;
        const itemCenter = item.x + item.w / 2;
        const distance = Math.abs(playerCenter - itemCenter);
        if (distance < 92 && distance < nearest) {
          nearest = distance;
          prompt = item;
        }
      }

    }

    function interact() {
      if (!started || ending || choice) return;
      if (dialogue) {
        advanceDialogue();
        return;
      }
      if (!prompt) return;

      if (night === 2) {
        interactNightTwo();
        return;
      }

      if (prompt.type === 'door' && stage === 0) {
        stage = 1;
        queueDialogue([
          ['我', '门锁好了。奇怪，门把手上全是水。'],
          ['我', '外面的雨应该碰不到这里。']
        ]);
      } else if (prompt.type === 'freezer' && stage === 1) {
        stage = 2; glitch = .55;
        queueDialogue([
          ['我', '插头还连着，可压缩机完全没有声音。'],
          ['收银机', '滴——']
        ]);
      } else if (prompt.type === 'counter' && stage === 2) {
        stage = 3; glitch = .75; inventory = ['旧小票'];
        queueDialogue([
          ['我', '小票上的时间是 00:33，正好比现在晚九分钟。'],
          ['我', '商品只有一件：热牛奶。购买人写着我的名字。'],
          ['门外', '咚。咚。咚。']
        ]);
      } else if (prompt.type === 'door' && stage === 3) {
        choice = { question: '门外的人穿着和你一样的工作服。', options: ['不开门', '开门'] };
      } else if (prompt.type === 'visitor' && stage === 4 && visitor.arrived) {
        stage = 5;
        queueDialogue([
          ['陌生顾客', '你的收银台上应该有一张小票。'],
          ['陌生顾客', '别让上面的时间变成现在。快去把它撕掉。']
        ]);
      } else if (prompt.type === 'counter' && stage === 5) {
        inventory = [];
        queueDialogue([
          ['我', '我撕开小票。纸的背面写着一句话。'],
          ['小票', '谢谢你替我值完这一班。']
        ], () => finish('替班', '灯光熄灭前，你看见柜台后站着另一个自己。', '第二天，店长说这里从来没有夜班。', palette.pink));
      } else {
        const ambient = {
          door: ['我', stage >= 3 ? '那个人还站在雨里，一动不动。' : '雨越来越大了。'],
          freezer: ['我', stage >= 2 ? '玻璃上结出了一串数字：00:33。' : '冷气似乎比平时更重。'],
          counter: ['我', '收银机的屏幕没有任何异常。'],
          visitor: ['陌生顾客', '时间不多了。']
        };
        queueDialogue([ambient[prompt.type]]);
      }
    }

    function interactNightTwo() {
      if (prompt.type === 'counter' && stage === 0) {
        stage = 1; glitch = .65;
        const contradiction = firstChoice === 'locked'
          ? '录像里，你在 00:31 打开了门。可你明明没有开。'
          : '录像里，你打开门后走了出去。可你记得自己留在店里。';
        queueDialogue([
          ['监控录像', '画面日期显示为昨天，时间停在 00:31。'],
          ['我', contradiction],
          ['监控录像', '画面里的你转过头，对着镜头做了一个噤声手势。']
        ]);
      } else if (prompt.type === 'freezer' && stage === 1) {
        stage = 2; glitch = .9; inventory = ['温热的牛奶'];
        visitor.visible = true; visitor.arrived = true; visitor.x = 560;
        queueDialogue([
          ['我', '冰柜里只有一瓶牛奶。它是温的。'],
          ['瓶身标签', '请交给站在第三排货架前的人。'],
          ['身后', '有人轻轻咳了一声。']
        ]);
      } else if (prompt.type === 'visitor' && stage === 2) {
        stage = 3; inventory = [];
        queueDialogue([
          ['陌生顾客', '谢谢。昨天也是你把它交给我的。'],
          ['我', '昨天来的人到底是谁？'],
          ['陌生顾客', '你应该问，今晚在门外的人是谁。']
        ]);
      } else if (prompt.type === 'door' && stage === 3) {
        choice = { question: '玻璃里没有你的倒影。门外却站着一个你。', options: ['查看监控', '离开这里'] };
      } else if (prompt.type === 'counter' && stage === 4) {
        glitch = 1;
        queueDialogue([
          ['监控录像', '店内只有一个人。'],
          ['监控录像', '他正站在你的身后，看着同一块屏幕。'],
          ['另一个我', '第三夜见。']
        ], () => finish('录像仍在继续', '屏幕里的时钟跳到了明天的 00:13。', '画面中，你再次推开便利店的门。', palette.pink, false));
      } else {
        const ambient = {
          counter: ['我', '监控画面正在循环播放同一分钟。'],
          freezer: ['我', '冰柜里传来细小的敲击声。'],
          door: ['我', '雨里那张脸和我一模一样。'],
          visitor: ['陌生顾客', '你已经见过我，只是顺序不对。']
        };
        queueDialogue([ambient[prompt.type]]);
      }
    }

    function queueDialogue(lines, onComplete = null) {
      dialogueQueue = lines.map(([speaker, value]) => ({ speaker, text: value }));
      dialogueQueue.onComplete = onComplete;
      dialogue = dialogueQueue.shift() || null;
    }

    function advanceDialogue() {
      if (dialogueQueue.length) {
        dialogue = dialogueQueue.shift();
      } else {
        dialogue = null;
        const done = dialogueQueue.onComplete;
        dialogueQueue.onComplete = null;
        if (done) done();
      }
    }

    function choose(index) {
      if (!choice) return;
      choice = null;
      glitch = 1;
      if (night === 2) {
        if (index === 0) {
          stage = 4;
          queueDialogue([['我', '我不看门外的人，转身跑向收银台。']]);
        } else {
          queueDialogue([
            ['我', '门没有上锁。我冲进雨里。'],
            ['门内的我', '明天记得准时来上班。']
          ], () => finish('走出循环', '你一路跑到天亮，却再次看见那块霓虹招牌。', '便利店的电子钟显示：00:13。', palette.cyan, false));
        }
        return;
      }
      if (index === 0) {
        firstChoice = 'locked';
        queueDialogue([
          ['我', '我关掉招牌，退回柜台后。'],
          ['身后', '咚。咚。咚。']
        ], () => finish('没有开门', '直到天亮，门外的人都没有离开。', '可监控录像里，他一直站在你的身后。', palette.cyan));
      } else {
        firstChoice = 'opened';
        stage = 4;
        visitor.visible = true;
        visitor.arrived = false;
        visitor.x = 104;
        queueDialogue([['门锁', '咔哒。门自己打开了。']]);
      }
    }

    function finish(title, line1, line2, color, next = night === 1) {
      ending = { title, line1, line2, color, next };
    }

    function resetGame() {
      night = 1; stage = 0; clock = 0; glitch = 0; started = true; firstChoice = null;
      dialogueQueue = []; dialogue = null; choice = null; ending = null; inventory = [];
      visitor.visible = false; visitor.arrived = false; visitor.x = 104;
      player.x = 210; player.y = FLOOR - player.h; player.vx = 0; player.vy = 0;
    }

    function startNightTwo() {
      night = 2; stage = 0; clock = 0; glitch = .8; started = false;
      dialogueQueue = []; dialogue = null; choice = null; ending = null; inventory = [];
      visitor.visible = false; visitor.arrived = false; visitor.x = 104;
      player.x = 710; player.y = FLOOR - player.h; player.vx = 0; player.vy = 0;
    }

    function jump() {
      if (player.grounded) {
        player.vy = -365;
        player.grounded = false;
      }
    }

    function frame(now) {
      const dt = Math.min((now - last) / 1000, .033);
      last = now;
      update(dt);
      drawBackground();
      drawPlayer();
      drawHUD();
      requestAnimationFrame(frame);
    }

    addEventListener('keydown', event => {
      if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'Space'].includes(event.code)) event.preventDefault();
      if (ending?.next && event.code === 'KeyN') { startNightTwo(); return; }
      if (!started) started = true;
      if (event.code === 'KeyR') { resetGame(); return; }
      if (choice && !event.repeat && event.code === 'Digit1') { choose(0); return; }
      if (choice && !event.repeat && event.code === 'Digit2') { choose(1); return; }
      keys.add(event.code);
      if (!event.repeat && ['KeyA', 'ArrowLeft'].includes(event.code)) {
        player.vx = Math.min(player.vx, -72);
        player.x = Math.max(20, player.x - 10);
      }
      if (!event.repeat && ['KeyD', 'ArrowRight'].includes(event.code)) {
        player.vx = Math.max(player.vx, 72);
        player.x = Math.min(W - player.w - 20, player.x + 10);
      }
      if (!event.repeat && ['KeyW', 'ArrowUp', 'Space'].includes(event.code)) jump();
      if (!event.repeat && event.code === 'KeyE') interact();
    });
    addEventListener('keyup', event => keys.delete(event.code));
    canvas.addEventListener('pointerdown', () => canvas.focus());

    requestAnimationFrame(frame);
  </script>
</body>
</html>
